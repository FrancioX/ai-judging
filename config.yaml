# Default configuration for the 3D pose estimation pipeline.

# Paths
raw_videos_dir: "raw_videos"
output_dir: "output"

# Frame extraction
frame_extraction:
  fps: null          # null = use original FPS; set a number to downsample
  max_frames: null   # null = all frames; cap for quick testing
  format: "jpg"
  quality: 95
  trim_start_seconds: 5    # trim N seconds from the start
  trim_end_seconds: 5      # trim N seconds from the end

# Person segmentation (YOLO-Seg) — used in quality-first pipeline.
# Detects and crops the skier before pose estimation, improving keypoint
# accuracy on distant subjects. Outputs bbox_padded offsets for coordinate
# remapping and high-resolution crops for the pose model.
segmentation:
  model: "yolo11x-seg"           # yolo11{n,s,m,l,x}-seg
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA
  confidence: 0.5
  padding_ratio: 0.50            # extra padding around bbox (fraction)
  select_strategy: "center"     # largest | center | highest_conf
  imgsz: 1280                    # YOLO input resolution (640/1280/1920)

# Temporal tracking — selects the best skier track from ByteTrack IDs,
# smooths bounding boxes and fills detection gaps by interpolation.
# Every frame is guaranteed to have exactly one bounding box.
tracking:
  enabled: true
  w_conf: 0.3                # weight for mean detection confidence
  w_center: 0.5              # weight for center-of-frame proximity
  w_length: 0.2              # weight for track duration ratio
  min_track_frames: 10       # ignore tracks shorter than this
  smooth_window: 5            # EMA window for bbox smoothing (0 = off)
  merge_tracks: true          # merge multiple high-scoring tracks (solves fragmentation)
  merge_score_threshold: 0.3  # minimum score for track inclusion in merge
  optical_flow_method: "auto" # auto (sparse LK + dense fallback) | sparse | dense | none
  flow_max_extrapolate_frames: 30  # max frames to extrapolate via OF for leading/trailing gaps
  flow_min_keypoints: 5       # min tracked keypoints before sparse→dense fallback
  # Identity guard — prevents tracking the wrong person via OF-predicted position
  identity_guard_enabled: true      # master switch for hybrid OF identity guard
  identity_guard_max_jump_px: 150   # reject detection if >150px from OF prediction AND >75px from prev
  identity_guard_reanchor_interval: 50  # re-anchor OF seed every 50 confident detected frames
  identity_guard_reanchor_min_conf: 0.5 # minimum detection confidence for re-anchor
  identity_guard_max_drift_px: 200  # force re-anchor if OF drift exceeds this
  # Velocity-consistent candidate scoring — penalises sudden velocity changes
  w_velocity: 0.4              # weight for velocity-consistency term (0 = disabled)
  of_synthetic_confidence: 0.3  # confidence for synthetic OF candidates (0 = disabled)
  vel_history_len: 5           # number of recent velocity vectors to maintain
  # Camera Motion Compensation (CMC) — separates camera motion from object motion
  cmc_enabled: false                # enable camera motion compensation
  cmc_method: "ecc"                 # orb (ORB features, fast) | ecc (Enhanced Correlation Coeff) | none
  cmc_exclude_margin: 1.5           # exclude N× skier bbox area from feature matching (background only)
  cmc_min_features: 20              # minimum matched features for valid homography (fallback to none)
  cmc_ransac_threshold: 3.0         # RANSAC outlier threshold in pixels for homography

# 2D pose estimation (YOLO-Pose)
pose_2d:
  yolo_model: "yolo11x-pose"    # yolo11{n,s,m,l,x}-pose (x for max accuracy)
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA, cpu
  imgsz: 640                     # inference resolution (640 default, crops ~60x100px)
  bbox_threshold: 0.25           # lower threshold for small/distant persons
  keypoint_threshold: 0.3

# 3D pose lifting
pose_3d:
  model: "motionbert"           # motionbert | videopose3d
  checkpoint: null              # auto-downloaded if null
  device: "mps"
  receptive_field: 243          # temporal window (frames)

# Ski detection
ski_detection:
  method: "grounding_sam2"      # grounding_sam2 | color_segmentation
  prompt: "ski"
  device: "mps"
  confidence: 0.35

# Visualization
visualization:
  render_3d: true
  overlay_2d: true
  segmentation_boxes: true    # reconstruct video with YOLO segmentation boxes
  export_format: "html"         # html (plotly) | ply | obj
  fps: null                    # null = match extraction/original fps
