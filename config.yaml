# Default configuration for the 3D pose estimation pipeline.

# Paths
raw_videos_dir: "raw_videos"
output_dir: "output"

# Frame extraction
frame_extraction:
  fps: null          # null = use original FPS; set a number to downsample
  max_frames: null   # null = all frames; cap for quick testing
  format: "jpg"
  quality: 95
  trim_start_seconds: 5    # trim N seconds from the start
  trim_end_seconds: 5      # trim N seconds from the end

# Person segmentation (YOLO-Seg) — used in quality-first pipeline.
# Detects and crops the skier before pose estimation, improving keypoint
# accuracy on distant subjects. Outputs bbox_padded offsets for coordinate
# remapping and high-resolution crops for the pose model.
segmentation:
  model: "yolo11x-seg"           # yolo11{n,s,m,l,x}-seg
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA
  confidence: 0.25
  padding_ratio: 0.50            # extra padding around bbox (fraction)
  select_strategy: "center"     # largest | center | highest_conf
  imgsz: 1280                    # YOLO input resolution (640/1280/1920)

# Temporal tracking — selects the best skier track from ByteTrack IDs,
# smooths bounding boxes and fills detection gaps by interpolation.
# Every frame is guaranteed to have exactly one bounding box.
tracking:
  enabled: true
  w_conf: 0.3                # weight for mean detection confidence
  w_center: 0.5              # weight for center-of-frame proximity
  w_length: 0.2              # weight for track duration ratio
  min_track_frames: 10       # ignore tracks shorter than this
  smooth_window: 5            # EMA window for bbox smoothing (0 = off)
  merge_tracks: true          # merge multiple high-scoring tracks (solves fragmentation)
  merge_score_threshold: 0.6  # minimum score for track inclusion in merge
  merge_min_detection_conf: 0.0  # minimum per-detection confidence to enter the merge candidate pool
  # Adaptive threshold: auto-selects between merge_threshold_low and merge_threshold_high
  # based on temporal overlap of swing tracks with the best track.
  # Non-overlapping swing tracks = skier fragments → use low threshold.
  merge_threshold_adaptive: true
  merge_threshold_low: 0.5
  merge_threshold_high: 0.6
  merge_threshold_min_overlap_ratio: 0.55  # det_rate(high/n_frames) < this → skier fragments cut → use low threshold
  w_continuity: 0.6           # weight for spatial continuity during merge conflict resolution
  w_track_stickiness: 0.4     # bonus for staying on the same ByteTrack ID during conflicts
  optical_flow_method: "auto" # auto (sparse LK + dense fallback) | sparse | dense | none
  of_gap_fill_enabled: true   # when false: OF trace still runs for Phase A merge scoring, but Phase B gap-fill uses linear interpolation
  of_min_gap_for_fill: 10     # gaps shorter than this use linear interpolation instead of OF (0 = always use OF)
  of_drift_guard_px: 400.0    # if OF result drifts >N px from linear interpolation, fall back to linear (0 = disabled)
  of_reanchor_min_conf: 0.0   # min detection confidence for OF trace re-anchoring in Phase A multi-candidate mode (0 = no filter)
  of_trace_filter_enabled: false  # when false: Phase A OF trace used only as soft score signal — hard proximity gate disabled
  flow_max_extrapolate_frames: 30  # max frames to extrapolate via OF for leading/trailing gaps
  flow_min_keypoints: 5       # min tracked keypoints before sparse→dense fallback
  # Identity guard — prevents tracking the wrong person via OF-predicted position
  identity_guard_enabled: false     # master switch for hybrid OF identity guard
  identity_guard_max_jump_px: 100   # in no-OF mode, reject detection if >100px from previous detection
  identity_guard_reanchor_interval: 50  # re-anchor OF seed every 50 confident detected frames
  identity_guard_reanchor_min_conf: 0.5 # minimum detection confidence for re-anchor
  identity_guard_max_drift_px: 200  # force re-anchor if OF drift exceeds this
  # Velocity-consistent candidate scoring — penalises sudden velocity changes
  w_velocity: 0.4              # weight for velocity-consistency term (0 = disabled)
  of_synthetic_confidence: 0.3  # confidence for synthetic OF candidates (0 = disabled)
  vel_history_len: 5           # number of recent velocity vectors to maintain
  # Camera Motion Compensation (CMC) — separates camera motion from object motion
  cmc_enabled: false                # enable camera motion compensation
  cmc_method: "ecc"                 # orb (ORB features, fast) | ecc (Enhanced Correlation Coeff) | none
  cmc_exclude_margin: 1.5           # exclude N× skier bbox area from feature matching (background only)
  cmc_min_features: 20              # minimum matched features for valid homography (fallback to none)
  cmc_ransac_threshold: 3.0         # RANSAC outlier threshold in pixels for homography
  conflict_of_multiplier: 1.0       # OF weight multiplier during Phase A genuine conflicts (was 3.0, reduced Iter 5)
  conflict_stickiness_multiplier: 1.0  # Stickiness weight multiplier during Phase A genuine conflicts (was 0.2)
  conflict_velocity_multiplier: 1.0  # Velocity weight multiplier during Phase A genuine conflicts
  w_size: 0.0                        # Phase A: bbox area consistency score weight (0 = disabled)
  w_color: 0.0                       # Phase A: HSV color histogram similarity weight (0 = disabled)
  r_det_pos: 4.0                     # Phase C Kalman: position noise for detected frames (lower = trust more)
  r_interp_pos: 40.0                 # Phase C Kalman: position noise for interpolated frames (higher = trust less)
  cotracker_enabled: false          # Phase B.1: CoTracker3 offline joint-trajectory fill for long gaps
  cotracker_min_gap: 20             # only re-fill gaps >= this length with CoTracker3
  cotracker_resize_h: 320           # resize frames to this height for CoTracker3 inference
  kalman_reinit_gap: 0              # Phase C: re-init Kalman state after gaps >= this length (0 = disabled)
  of_trace_single_cand_reanchor: false  # Phase A: restrict OF trace re-anchoring to single-candidate frames only
  of_trace_bidirectional: false         # Phase A: blend forward + backward OF traces (Iter 2: tested, slight regression +0.6px, disabled)

# 2D pose estimation (YOLO-Pose)
pose_2d:
  yolo_model: "yolo11x-pose"    # yolo11{n,s,m,l,x}-pose (x for max accuracy)
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA, cpu
  imgsz: 640                     # inference resolution (640 default, crops ~60x100px)
  bbox_threshold: 0.25           # lower threshold for small/distant persons
  keypoint_threshold: 0.3

# 3D pose lifting
pose_3d:
  model: "motionbert"           # motionbert | naive
  checkpoint: null               # required for motionbert unless checkpoint_url is set
  checkpoint_url: "https://huggingface.co/walterzhu/MotionBERT/resolve/main/checkpoint/pose3d/FT_MB_release_MB_ft_h36m/best_epoch.bin?download=true"
  device: "mps"
  receptive_field: 81           # temporal window (frames)
  batch_size: 16
  model_kwargs:
    dim_in: 3
    dim_out: 3
    dim_feat: 512
    dim_rep: 512
    depth: 5
    num_heads: 8
    mlp_ratio: 2
    num_joints: 17
    maxlen: 243
    att_fuse: true

# Visualization
visualization:
  render_3d: true
  overlay_2d: true
  segmentation_boxes: true    # reconstruct video with YOLO segmentation boxes
  export_format: "html"         # html (plotly) | ply | obj
  fps: null                    # null = match extraction/original fps
