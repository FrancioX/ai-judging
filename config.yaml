# Default configuration for the 3D pose estimation pipeline.

# Paths
raw_videos_dir: "raw_videos"
output_dir: "output"

# Frame extraction
frame_extraction:
  fps: null          # null = use original FPS; set a number to downsample
  max_frames: null   # null = all frames; cap for quick testing
  format: "jpg"
  quality: 95
  trim_start_seconds: 5    # trim N seconds from the start
  trim_end_seconds: 5      # trim N seconds from the end

# Person segmentation (YOLO-Seg) — used in quality-first pipeline.
# Detects and crops the skier before pose estimation, improving keypoint
# accuracy on distant subjects. Outputs bbox_padded offsets for coordinate
# remapping and high-resolution crops for the pose model.
segmentation:
  model: "yolo11x-seg"           # yolo11{n,s,m,l,x}-seg
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA
  confidence: 0.5
  padding_ratio: 0.15            # extra padding around bbox (fraction)
  select_strategy: "center"     # largest | center | highest_conf

# 2D pose estimation
# backend: "yolo" (fast, MPS-native) or "rtmpose" (higher accuracy, CPU-only on Mac)
pose_2d:
  backend: "yolo"                # yolo | rtmpose
  yolo_model: "yolo11x-pose"    # yolo11{n,s,m,l,x}-pose (x for max accuracy)
  model: "rtmpose-l_8xb256-420e_coco-256x192"  # used when backend=rtmpose
  det_model: "rtmdet-m"         # person detector for rtmpose backend
  device: "mps"                  # mps for Apple Silicon, cuda:0 for NVIDIA, cpu
  imgsz: 640                     # inference resolution (640 default, crops ~60x100px)
  bbox_threshold: 0.25           # lower threshold for small/distant persons
  keypoint_threshold: 0.3

# 3D pose lifting
pose_3d:
  model: "motionbert"           # motionbert | videopose3d
  checkpoint: null              # auto-downloaded if null
  device: "mps"
  receptive_field: 243          # temporal window (frames)

# Ski detection
ski_detection:
  method: "grounding_sam2"      # grounding_sam2 | color_segmentation
  prompt: "ski"
  device: "mps"
  confidence: 0.35

# Visualization
visualization:
  render_3d: true
  overlay_2d: true
  segmentation_boxes: true    # reconstruct video with YOLO segmentation boxes
  export_format: "html"         # html (plotly) | ply | obj
  fps: 30
